version: '3.8'

services:
  # Persistence Layer: TimescaleDB for time-series grid data 
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: auragrid-db
    environment:
      - POSTGRES_USER=bescom_admin
      - POSTGRES_PASSWORD=grid_secure_pass
      - POSTGRES_DB=auragrid
    ports:
      - "5433:5432" # Host 5433 mapped to container 5432
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  # Nervous System: Kafka for high-concurrency event streaming [cite: 110, 111, 136]
  zookeeper:
    image: bitnami/zookeeper:latest
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    image: bitnami/kafka:latest
    container_name: auragrid-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_ANONYMOUS_LOGIN=yes
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
    depends_on:
      - zookeeper

  # Brain Layer: Python FastAPI serving Prophet ML forecasts [cite: 106, 129, 130]
  ai-engine:
    build: ./ai-engine
    container_name: auragrid-ai
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://bescom_admin:grid_secure_pass@timescaledb:5432/auragrid
    depends_on:
      - timescaledb

  # Core Layer: GoLang API for Water-Filling & Synergy math [cite: 103, 104, 124]
  core-api:
    build: ./core-api
    container_name: auragrid-core
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKERS=kafka:9092
      - DB_URL=postgres://bescom_admin:grid_secure_pass@timescaledb:5432/auragrid
    depends_on:
      - kafka
      - timescaledb

  # Client Layer: Next.js Frontend [cite: 93, 101, 116]
  frontend:
    build: ./frontend
    container_name: auragrid-ui
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - core-api
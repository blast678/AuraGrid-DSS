version: '3.8'

services:
  # 1. THE DATABASE (TimescaleDB / Postgres)
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: bescom-db
    environment:
      POSTGRES_USER: bescom_user
      POSTGRES_PASSWORD: bescom_password
      POSTGRES_DB: bescom_grid
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. ZOOKEEPER (Manages Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: bescom-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # 3. APACHE KAFKA (The Event Bus)
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: bescom-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 4. KAFKA UI (Visual Dashboard)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bescom-kafka-ui
    ports:
      - "9000:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: bescom-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

